[package]
name = "aim_calibration"
version = "0.1.0"
edition = "2024"
description = "Trouvez la sensibilité de souris idéale pour vos jeux FPS"
license-file = "LICENSE"
publish = false

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time"] }
